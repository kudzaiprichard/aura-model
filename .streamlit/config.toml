# AURA inference dashboard — native Streamlit theme.
# Theming every widget through Streamlit's own variables (rather than brute-force
# CSS) keeps dropdowns, popovers, sliders and tooltips consistent and flicker-free.
[theme]
base = "dark"

# Indigo / electric-blue accent (primary actions, focus rings, active nav).
primaryColor = "#4F7CFF"

# Surface ramp: base canvas → panels / sidebar / inputs.
backgroundColor = "#0B0F17"
secondaryBackgroundColor = "#131A24"

textColor = "#E6EAF0"
linkColor = "#7AA2FF"

# Compact, enterprise density.
borderColor = "#243042"
showWidgetBorder = true
baseRadius = "0.5rem"
baseFontSize = 14

font = "sans-serif"
codeFont = "monospace"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
